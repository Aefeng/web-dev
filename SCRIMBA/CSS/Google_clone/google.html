<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="google.css">
</head>
<body>
<!--I put the button in a div so if the image is changed or removed i still have the margin intact-->
<!--We use class to be more spacific about which particular element we want especially in cases where you have multiple divs, imgs etc-->
<!--When targetting in css we use .classname{}-->
    <div class="main">
        <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/1280px-Google_2015_logo.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" alt="Google's Logo" class="img_1">
        <input type="text" class="input_1">
        <!-- the reason i created this div is so i can use the flexbox option to arrange these buttons -->
        <div class="Extra-buttons">
            <button class="btn_1">Google Search</button>
            <button class="btn_1">I'm Feeling Lucky</button>
        </div>
     
    </div>
    
    
</body>
</html>
