<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="score_board.css"> 
    <title>Scoreboard</title>
</head>
<body>
    <div class="main">
        <div id="home">
            <h2>HOME</h2>
            <div class="box" id="home-box">
                <p id="score_home">0</p>
            </div>
            <div class="incr_btns">
                <!-- Home buttons -->
                <button onclick="addPoints('home', 1)">+1</button>
                <button onclick="addPoints('home', 2)">+2</button>
                <button onclick="addPoints('home', 3)">+3</button>
            </div>
        </div>
        <button id="new_game" onclick="new_game()">New Game</button>
        <div id="away">
            <h2>AWAY</h2>
            <div class="box"  id="away-box">
                <p id="score_away">0</p>
            </div>
            <div class="incr_btns">
                <!-- Home buttons -->
                <button onclick="addPoints('away', 1)">+1</button>
                <button onclick="addPoints('away', 2)">+2</button>
                <button onclick="addPoints('away', 3)">+3</button>
            </div>
        </div>

    </div>
   

    <script src="score_board.js"></script>
</body>
</html>
