<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calc.css">
    <title>Calculator</title>
</head>
<body>
    <div class="main">
        <span class="text">
            <p id="num1-el"></p>
            <p id="num2-el"></p>
        </span>
        <div id="buttons">
            <button id="add_btn" onclick="add()">Add</button>
            <button id="sub_btn" onclick="subtract()">Subtract</button>
            <button id="div_btn" onclick="divide()">Divide</button>
            <button id="mul_btn" onclick="multiply()">Multiply</button>
        </div>
        <p id="result"></p>
    </div>

    <script src="calc.js"></script>

    
</body>
</html>
