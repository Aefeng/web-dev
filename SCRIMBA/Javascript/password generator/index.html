<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pass_gen.css">
    <title>password Generator</title>
</head>
<body>
    <div id="maincontainer">
        <p id="Generate_txt">Generate a</p> 
        <p id = "randpass_txt">random password</p>
        <P id = "small_txt">Never use an insecure password again</P>
        <input id="password_length" type="number", min="5" max="21">
        <label><input id="symbols" type="checkbox" checked>Symbols</label>
        <label><input id="numbers" type="checkbox" checked>Numbers</label>
        <section>
        <button id="gen_btn" onclick = "generatePassword()">Generate passwords</button>
        </section>
        

        <div class="display_div" >
            <div id="display_1"></div>
            <div id="display_2"></div>
        </div>
        <p id="copied_msg"></p>

    </div>
    <script src="pass_gen.js"></script>
    
    
</body>
</html>
