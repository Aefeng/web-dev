<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="global.css">
    <title>E-commerce</title>
</head>
<body>
    <header>
       
        <a href="index.html" id="LOGO">Team Store</a>

        <div class="nav_links">
            <a  class=text_anim href="shop.html">Shop</a>
            <a  class=text_anim href="kitchen.html"> Kitchen</a>
            <a  class=text_anim href="Living.html"> Living</a>
            <a  class=text_anim href="about.html" target="_self"> About</a>
        </div>

        <a  class=text_anim href="cart.html">Cart(2)</a>
    </header>
    

    <div class="hero_section">
        <div class="hero_text">
            <p id="season">NEW SEASON</p>
            <p class="main_text">Everyday things, made to last</p>
            <p class="brief">Want to buy basic everyday goods easily, check out our catalogue</p>
            <a href="shop.html"> <button > Shop The collection</button></a>
        </div>

        <div class="image">
            <img src="images/hero_image.png" id="hero_image">
        </div>
    </div>
  
    <section class="featured">
        <div class="featured_header">
            <h2 class="featured_title">Featured</h2>
            <a href="shop.html" class="view_all">view all</a>
        </div>

            <div class="product_row">
                <a href="#" class="product_card" alt="">
                    <div class="card sage"><img src="images/shop_blender.jpg" class="product_image"></div>
                    <div class="product_name">Blender</div>
                    <div class="price">$16</div>
                </a>

                <a href="#" class="product_card" alt="">
                    <div class="card rose"><img src="images/shop_bath towel set2.jpeg" alt="linen throw" class="product_image"></div>
                    <div class="product_name">Bath Towels</div>
                    <div class="price">$14</div>
                </a>

                <a href="#" class="product_card" alt="">
                    <div class="card blue"><img src="images/serving_tray.png"  class="product_image"></div>
                    <div class="product_name">Oak serving Board</div>
                    <div class="price">$46</div>
                </a>

                <a href="#" class="product_card" alt="">
                    <div class="card sand"><img src="images/living chair.avif" class="product_image"></div>
                    <div class="product_name">Chair</div>
                    <div class="price">$34</div>
                </a>
            </div>

        
    </section>

    <footer>
        <span>&copy; Team Store</span>
        <i class="fa-brands fa-instagram"></i>
        <div class="footer-links">
            <a href="contact.html">Contact</a>
            <a href="shipping.html">Shipping</a>
            <a href="returns.html">Returns</a>
        </div>

    </footer>
</body>
</html>
