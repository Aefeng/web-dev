<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>E-commerce</title>
</head>
<body>
    <header>
       
        <a href="index.html" id="LOGO">Team Store</a>

        <div class="nav_links">
            <a href="shop.html">Shop</a>
            <a href="kitchen.html"> Kitchen</a>
            <a href="Living.html"> Living</a>
            <a href="About"> About</a>
        </div>

        <a href="cart.html">Cart</a>
    </header>
    

    <div class="hero_section">
        <div class="hero_text">
            <p id="season">NEW SEASON</p>
            <p class="main_text">Everyday things, made to last</p>
            <p class="brief">Want to buy basic everyday goods easily, check out our catalogue</p>
            <button> Shop The collection</button>
        </div>

        <div class="image">
            <img src="images/hero_image.png" id="hero_image">
        </div>
    </div>
  
    <section class="featured">
        <div class="featured_header">
            <h2 class="featured_title">Featured</h2>
            <a href="#" class="view_all">view all</a>
        </div>

            <div class="product_row">
                <a href="#" class="product_card" alt="">
                    <div class="card sage"><img src="images/mug.png" class="product_image"></div>
                    <div class="product_name">Stoneware Mug</div>
                    <div class="price">$28</div>
                </a>

                <a href="#" class="product_card" alt="">
                    <div class="card rose"><img src="images/linenthrow.jpg" alt="linen throw" class="product_image"></div>
                    <div class="product_name">Linen throw</div>
                    <div class="price">$64</div>
                </a>

                <a href="#" class="product_card" alt="">
                    <div class="card blue"><img src="images/serving_tray.png"  class="product_image"></div>
                    <div class="product_name">Oak serving Board</div>
                    <div class="price">$46</div>
                </a>

                <a href="#" class="product_card" alt="">
                    <div class="card sand"><img src="images/bronze_candle holder.jpeg" class="product_image"></div>
                    <div class="product_name">Brass Candle holder</div>
                    <div class="price">$34</div>
                </a>
            </div>

        
    </section>

    <footer>
        <a href="index.html" id="LOGO">Team Store</a>
        <p> Contact.Shipping.Returns</p>

    </footer>
</body>
</html>
