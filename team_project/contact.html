<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Team Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <a href="index.html" id="LOGO">Team Store</a>

        <div class="nav_links">
            <a class=text_anim href="shop.html">Shop</a>
            <a class=text_anim href="kitchen.html"> Kitchen</a>
            <a class=text_anim href="Living.html"> Living</a>
            <a  class=text_anim href="about.html" target="_self"> About</a>
        </div>

        <a class=text_anim href="cart.html">Cart(2)</a>
    </header>

    <main>
        <h1 class="page_title">Contact</h1>

        <form action="#" method="post">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message"></textarea>
            </div>

            <button type="submit" class="send_button">Send message</button>
        </form>
    </main>

    <footer>
        <span>&copy; Team Store</span>
        <div class="footer-links">
            <a href="contact.html">Contact</a>
            <a href="shipping.html">Shipping</a>
            <a href="returns.html">Returns</a>
        </div>
    </footer>
</body>
</html>
